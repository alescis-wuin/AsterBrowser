[workspace]
resolver = "2"
members = ["crates/browser-contracts", "crates/browser-core", "crates/frontend-slint", "crates/engine-cef", "crates/browser-render-wgpu", "crates/benchmark-control", "apps/desktop"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
browser-contracts = { path = "crates/browser-contracts" }
browser-core = { path = "crates/browser-core" }
frontend-slint = { path = "crates/frontend-slint" }
# engine-cef is intentionally not a global dependency: only a concrete app opts in.
