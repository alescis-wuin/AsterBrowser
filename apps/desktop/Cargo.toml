[package]
name = "aster-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
cef = ["dep:engine-cef", "engine-cef/cef-runtime"]
cef-gpu = ["cef", "engine-cef/gpu", "frontend-slint/gpu", "dep:browser-render-wgpu"]
benchmark-control = ["dep:benchmark-control"]

[dependencies]
browser-contracts.workspace = true
browser-core.workspace = true
frontend-slint.workspace = true
engine-cef = { path = "../../crates/engine-cef", optional = true }
browser-render-wgpu = { path = "../../crates/browser-render-wgpu", optional = true }
benchmark-control = { path = "../../crates/benchmark-control", optional = true }
